<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JD Analyzer — careerCTL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-03QJLKXWZE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-03QJLKXWZE');
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <header>
    <a href="/" class="logo">
  <span class="logo-bracket">[</span>career<span class="logo-slash">/</span>ctl<span class="logo-bracket">]</span>
</a>
    <p class="tagline">jd analyzer</p>
    <a href="/" class="back-link">← back to tools</a>
  </header>
  <main>
    <section class="input-panel">
      <div class="textarea-group">
        <label for="resume"><span class="label-num">01</span> Your Resume</label>
        <textarea id="resume" placeholder="Paste your resume here, or upload a PDF below…" spellcheck="false"></textarea>
        <span class="char-count" id="resume-count">0 characters</span>
        <div class="file-upload-row">
          <label for="resume-file" class="file-label"><span class="file-icon">↑</span> Upload PDF instead</label>
          <input type="file" id="resume-file" accept=".pdf,.txt" />
          <span class="file-name" id="file-name">no file chosen</span>
        </div>
      </div>
      <div class="divider"><span>vs</span></div>
      <div class="textarea-group">
        <label for="job-description"><span class="label-num">02</span> Job Description</label>
        <textarea id="job-description" placeholder="Paste the full job posting here…" spellcheck="false"></textarea>
        <span class="char-count" id="jd-count">0 characters</span>
      </div>
      <button id="analyze-btn" class="primary-btn full-width">
        <span class="btn-text">Analyze Match</span>
        <span class="btn-loader" style="display:none"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </button>
      <p id="error-msg" class="error-msg" hidden></p>
    </section>

    <section class="results-panel" id="results" hidden>
      <div class="score-block">
        <div class="score-ring-wrap">
          <svg class="score-ring" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52"/>
            <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
          </svg>
          <div class="score-center">
            <span class="score-num" id="score-num">—</span>
            <span class="score-label">match</span>
          </div>
        </div>
        <p class="summary-text" id="summary-text"></p>
      </div>

      <div class="card">
        <h3>Seniority Match</h3>
        <div class="seniority-row">
          <div class="seniority-pill" id="seniority-jd">
            <span class="pill-label">Role</span>
            <span class="pill-level" id="seniority-jd-val">—</span>
          </div>
          <span class="seniority-arrow">→</span>
          <div class="seniority-pill" id="seniority-resume">
            <span class="pill-label">You</span>
            <span class="pill-level" id="seniority-resume-val">—</span>
          </div>
        </div>
        <p class="seniority-verdict" id="seniority-verdict"></p>
      </div>

      <div class="card-grid">
        <div class="card card--green">
          <h3><span class="card-icon">✓</span> Keywords Found</h3>
          <div class="tag-list" id="matched-tags"></div>
        </div>
        <div class="card card--red">
          <h3><span class="card-icon">✗</span> Missing Keywords</h3>
          <div class="tag-list" id="missing-tags"></div>
        </div>
      </div>

      <div class="card">
        <h3>Skill Gaps</h3>
        <div class="gap-list" id="gap-list"></div>
      </div>

      <div class="card-grid">
        <div class="card">
          <h3>Strengths</h3>
          <ul class="bullet-list" id="strengths-list"></ul>
        </div>
        <div class="card card--accent">
          <h3>⚡ Quick Wins</h3>
          <ul class="bullet-list" id="quickwins-list"></ul>
        </div>
      </div>
    </section>
  </main>
  <script src="analyzer.js"></script>
</body>
</html>
