<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Summary — careerCTL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-03QJLKXWZE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-03QJLKXWZE');
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <header>
    <a href="/" class="logo">
      <span class="logo-bracket">[</span>career<span class="logo-slash">/</span>ctl<span class="logo-bracket">]</span>
    </a>
    <p class="tagline">linkedin summary</p>
    <a href="/" class="back-link">← back to tools</a>
  </header>
  <main>
    <div class="tool-layout">

      <!-- Left: inputs + options -->
      <div class="tool-left">
        <div class="card" style="height:100%">
          <h3>Your Details</h3>

          <div class="textarea-group" style="margin-bottom:1rem">
            <label for="resume"><span class="label-num">01</span> Resume</label>
            <textarea id="resume" style="min-height:200px" placeholder="Paste your resume here, or upload a PDF below…" spellcheck="false"></textarea>
            <span class="char-count" id="resume-count">0 characters</span>
            <div class="file-upload-row">
              <label for="resume-file" class="file-label"><span class="file-icon">↑</span> Upload PDF instead</label>
              <input type="file" id="resume-file" accept=".pdf,.txt" />
              <span class="file-name" id="file-name">no file chosen</span>
            </div>
          </div>

          <div class="cl-control-group">
            <label class="cl-label">Tone</label>
            <div class="cl-toggle" id="tone-toggle">
              <button class="cl-toggle-btn active" data-value="professional">Professional</button>
              <button class="cl-toggle-btn" data-value="conversational">Conversational</button>
            </div>
          </div>

          <div class="cl-control-group">
            <label class="cl-label">Job Search Status</label>
            <div class="cl-toggle" id="focus-toggle">
              <button class="cl-toggle-btn active" data-value="job seeking">Job Seeking</button>
              <button class="cl-toggle-btn" data-value="open to opportunities">Open to Opps</button>
              <button class="cl-toggle-btn" data-value="not looking but open">Not Looking</button>
            </div>
          </div>

          <button class="primary-btn" id="generate-btn" style="margin-top:1.5rem">
            <span class="btn-text">Generate Summaries</span>
            <span class="btn-loader" style="display:none"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
          </button>
          <p class="error-msg" id="error-msg" hidden></p>
        </div>
      </div>

      <!-- Right: output -->
      <div class="tool-right">
        <div class="card" style="height:100%">
          <div class="empty-state" id="empty-state" style="display:flex">
            <p>Paste your resume and hit Generate</p>
          </div>
          <div id="li-results" style="display:none">
            <h3 style="margin-bottom:1rem">LinkedIn Summaries</h3>
            <div class="rewrite-list" id="summary-list"></div>
          </div>
        </div>
      </div>

    </div>
  </main>
  <script src="linkedin.js"></script>
</body>
</html>
